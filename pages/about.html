  <!-- Client: the one light band -->
  <section class="client" aria-label="Client">
    <img class="client__photo" src="assets/img/jeff.avif" alt="Jeff Ciachurski" loading="lazy" decoding="async">
    <div class="client__body">
      <p class="mono client__kicker">Client</p>
      <!-- Testimonial approved by Jeff Ciachurski (per Konner, 2026-11-11). -->
      <figure class="quote" data-rise>
        <blockquote class="quote__text">“COET took a machine only our engineers could explain and made it something anyone can understand. Brand, site, renders and interface from one team, and every piece feels like the same product.”</blockquote>
        <figcaption>
          <span class="quote__name">Jeff Ciachurski</span>
          <span class="mono quote__role">Executive Chairman, Captiva Verde</span>
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- Team, around the studios globe -->
  <section class="section team" id="team" aria-labelledby="team-title">
    <header class="wrap head">
      <h2 class="head__title" id="team-title" data-rise>Team<sup>13</sup></h2>
      <p class="head__sub" data-rise>The people behind it.</p>
    </header>
    <div class="wrap">
      <div class="team__globe" data-globe aria-hidden="true">
        <canvas></canvas>
        <p class="team__studio mono"><span data-studio-name>Scottsdale</span><span data-studio-lat>33.4942°N</span><span data-studio-lng>111.9261°W</span></p>
      </div>
      <ul class="people">{{team}}</ul>
    </div>
    <dialog class="bio" aria-labelledby="bio-title" data-bio-dialog>
      <button class="bio__close" type="button" aria-label="Close bio" data-bio-close><span aria-hidden="true">&times;</span></button>
      <div class="bio__in">
        <div class="bio__pic"><img alt="" data-bio-img></div>
        <div class="bio__text" data-bio-text></div>
      </div>
    </dialog>
  </section>

  <!-- Close -->
  <section class="section close" id="contact" aria-labelledby="close-title">
    <div class="wrap">
      <p class="close__status"><span class="flag">Accepting 3 more projects this quarter</span></p>
      <h2 class="display close__title" id="close-title" data-rise><span>Let's build</span> <span>the future of hardware.</span></h2>
      <!-- Leads go straight to Jason's inbox through FormSubmit (formsubmit.co). The first submission sends a
           one-time activation email that must be clicked; after that FormSubmit gives a random alias that can
           replace the address below, so the raw address is no longer in the page. -->
      <form class="lead" data-lead action="https://formsubmit.co/ajax/jason.coawette@gmail.com" method="post" novalidate data-rise>
        <p class="lead__intro">Tell us about the machine.</p>
        <div class="lead__row">
          <label class="lead__field"><span>Name</span><input name="name" autocomplete="name" required maxlength="80"></label>
          <label class="lead__field"><span>Email</span><input name="email" type="email" autocomplete="email" required maxlength="120"></label>
        </div>
        <label class="lead__field"><span>Company <em>(optional)</em></span><input name="company" autocomplete="organization" maxlength="120"></label>
        <label class="lead__field"><span>What are you building?</span><textarea name="message" rows="2" required maxlength="2000"></textarea></label>
        <input type="text" name="_honey" class="lead__trap" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="_subject" value="New lead from the COET site">
        <input type="hidden" name="_template" value="table">
        <div class="lead__foot">
          <button class="btn" type="submit" data-sfx="press">Send</button>
          <p class="lead__status" role="status" aria-live="polite" data-lead-status></p>
        </div>
      </form>
      <a class="link" href="work/" data-sfx="tick">See our work <span aria-hidden="true">→</span></a>
    </div>
  </section>
